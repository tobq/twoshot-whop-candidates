<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TwoShot candidates · Round 2</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="page.css">
<!-- Classic scripts only, so the page opens straight from disk as well as over HTTP.
     page.global.js is generated by page-build.mjs from page.js and its imports; never edit it by hand. -->
<script defer src="vendor/justified-layout/justified-layout.global.js"></script>
<script defer src="vendor/ui-kit-orb/orb.global.js"></script>
<script defer src="page.global.js"></script>
</head>
<body>
<div class="canvas" aria-hidden="true"></div>
<div class="tray">
  <main id="collage" aria-label="Candidates" aria-busy="true">
    <div class="mosaic"></div>
    <p id="status" role="status">Loading candidates…</p>
  </main>
  <footer class="dock">
    <div class="composer-wrap">
      <div class="note-saved" hidden>
        <button type="button" class="note-text" title="Edit note"></button>
        <button type="button" class="icon-btn note-remove" aria-label="Remove note" title="Remove note"></button>
      </div>
      <form class="composer" id="composer">
        <textarea id="note" rows="1" placeholder="Something else…" aria-label="Something else"></textarea>
        <button type="submit" class="btn" id="save-note" disabled>Save</button>
      </form>
    </div>
    <div class="controls">
      <span id="pick-count"></span>
      <span class="zoom-slot" id="zoom-slot"></span>
      <span id="zoom-value">100%</span>
      <button type="button" class="icon-btn" id="view-toggle"></button>
    </div>
  </footer>
</div>
<div id="announce" class="sr-only" aria-live="polite"></div>
<noscript>This review page needs JavaScript to pack the candidates and run the AI previews.</noscript>
<dialog id="lightbox" aria-label="Enlarged candidate">
  <div class="lb-stage"></div>
  <div class="lb-bar">
    <span class="lb-key"></span>
    <div class="lb-media" hidden></div>
    <button type="button" class="btn ghost lb-pick" aria-pressed="false"><span class="lb-pick-icon"></span><span class="lb-pick-text">Pick</span></button>
    <button type="button" class="icon-btn lb-close" aria-label="Close" title="Close"></button>
  </div>
</dialog>
</body>
</html>
