<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TwoShot Whop candidates</title>
<!-- Candidates only: three directions side by side, every asset at its real proportions, no captions.
     Keys: column letter + row number (B4 = direction B, end screen). Click any image or video to enlarge.
     Published copy of Documents/twoshot-logo/whop/index.html: download links dropped (the viewer blocks downloads). -->
<style>
:root {
  --canvas: #FFFFFF;
  --ink: #0A0A0B;
  --ink-2: #55565C;
  --ink-3: #8A8B91;
  --hairline: rgba(10, 10, 11, 0.10);
  --scrim: rgba(10, 10, 11, 0.92);
  --check-light: #FFFFFF; --check-light-2: #E4E4E7;
  --check-dark: #1C1C1F;  --check-dark-2: #2A2A2E;
  --r-panel: 8px;
  --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-6: 24px; --s-8: 32px; --s-12: 48px;
  --t-meta: 11px; --t-text: 13px;
  --w-medium: 500; --w-strong: 600;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --canvas: #0E0E10; --ink: #F2F2F3; --ink-2: #A9AAB0; --ink-3: #74757C; --hairline: rgba(255, 255, 255, 0.10); color-scheme: dark; }
}
:root[data-theme="dark"] { --canvas: #0E0E10; --ink: #F2F2F3; --ink-2: #A9AAB0; --ink-3: #74757C; --hairline: rgba(255, 255, 255, 0.10); color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--font); font-size: var(--t-text); line-height: 1.5; }
main { max-width: 1440px; margin: 0 auto; padding: var(--s-8) var(--s-6) var(--s-12); }

.row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-6); padding: var(--s-6) 0; border-top: 1px solid var(--hairline); align-items: start; }
.row.head { border-top: 0; padding: 0 0 var(--s-3); }
.row.shared { grid-template-columns: minmax(0, 1fr); }
.cell { min-width: 0; }

.key { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); height: 20px; margin-bottom: var(--s-2);
  font-size: var(--t-meta); font-weight: var(--w-medium); letter-spacing: 0.06em; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.head .key { height: 28px; margin: 0; font-size: var(--t-text); font-weight: var(--w-strong); letter-spacing: 0.02em; color: var(--ink); }
.m:focus-visible { outline: none; }
.slot:has(> .m:focus-visible) { box-shadow: 0 0 0 2px var(--canvas), 0 0 0 4px var(--ink-2); }

.slot { position: relative; border-radius: var(--r-panel); overflow: hidden; max-width: 100%; }
.m { display: block; width: 100%; height: 100%; object-fit: contain; cursor: zoom-in; }
.alpha.light { background-color: var(--check-light); background-image: conic-gradient(var(--check-light-2) 25%, transparent 0 50%, var(--check-light-2) 0 75%, transparent 0); background-size: 16px 16px; }
.alpha.dark { background-color: var(--check-dark); background-image: conic-gradient(var(--check-dark-2) 25%, transparent 0 50%, var(--check-dark-2) 0 75%, transparent 0); background-size: 16px 16px; }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-3); align-items: start; }
.duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-6); align-items: start; }

/* store banner with the square logo overlapping its bottom edge: the avatar is 20% of the banner's width and
   centred on that edge, so the box needs half its height (10% of the width) below the banner */
.store { position: relative; padding-bottom: 10%; }
.store .avatar { position: absolute; left: 4%; bottom: 0; width: 20%; border-radius: 18%; box-shadow: 0 0 0 3px var(--canvas); }

dialog#zoom { border: 0; padding: 0; margin: 0; width: 100vw; height: 100vh; max-width: none; max-height: none; background: transparent; overflow: auto; overscroll-behavior: contain; }
dialog#zoom::backdrop { background: var(--scrim); }
dialog#zoom .stage { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 3vh 3vw; }
dialog#zoom .frame { line-height: 0; border-radius: var(--r-panel); overflow: hidden; }
dialog#zoom .frame > * { display: block; max-width: 94vw; max-height: 94vh; }
dialog#zoom.doc .stage { align-items: flex-start; }
dialog#zoom.doc .frame > * { width: min(1100px, 94vw); max-height: none; }

@media (max-width: 760px) {
  main { padding: var(--s-6) var(--s-4) var(--s-8); }
  .row, .duo { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
<main></main>
<dialog id="zoom"><div class="stage"></div></dialog>
<script>
'use strict';
(() => {
  const DIRS = ['a', 'b', 'c'];
  const at = (d, name) => `candidates/${d}/${name}`;
  const main = document.querySelector('main');
  const dialog = document.getElementById('zoom'), stage = dialog.querySelector('.stage');
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function el(tag, props = {}, ...kids) {
    const e = Object.assign(document.createElement(tag), props);
    e.append(...kids);
    return e;
  }

  // ---- grid videos play only while on screen, and pause under the enlarged view ----
  const visible = new Set();
  const play = (v) => v.play().catch(() => {});
  const io = new IntersectionObserver((entries) => {
    for (const { target: v, isIntersecting } of entries) {
      if (isIntersecting) { visible.add(v); if (!dialog.open && !reduceMotion) play(v); } else { visible.delete(v); v.pause(); }
    }
  });

  /** One asset at its own proportions. A file that fails to load hides its slot instead of showing a broken icon. */
  function media(src, w, h, { alpha = '', doc = false } = {}) {
    const video = /\.(mp4|webm)$/i.test(src);
    const slot = el('div', { className: alpha ? `slot alpha ${alpha}` : 'slot' });
    slot.style.aspectRatio = `${w} / ${h}`;
    const m = el(video ? 'video' : 'img', { className: 'm', tabIndex: 0 });
    m.dataset.zoom = doc ? 'doc' : 'fit';
    if (alpha) m.dataset.alpha = alpha;
    m.addEventListener('error', () => { slot.hidden = true; });
    if (video) {
      Object.assign(m, { muted: true, loop: true, playsInline: true, preload: 'metadata' });
      io.observe(m);
    } else {
      Object.assign(m, { alt: src.split('/').pop(), decoding: 'async', loading: 'lazy' });
    }
    m.src = src;
    slot.append(m);
    return slot;
  }
  const pair = (...kids) => el('div', { className: 'pair' }, ...kids);
  function store(d) {
    const banner = media(at(d, `store-banner-${d}.png`), 1920, 640);
    const avatar = media(at(d, `square-logo-${d}.png`), 1024, 1024);
    avatar.classList.add('avatar');
    const box = el('div', { className: 'store' }, banner, avatar);
    banner.firstChild.addEventListener('error', () => { box.hidden = true; });
    return box;
  }
  const key = (text) => el('div', { className: 'key' }, el('span', { textContent: text }));

  // ---- the rows: one per asset, one cell per direction ----
  const ROWS = [
    (d) => [media(at(d, `thumbnail-${d}.png`), 1920, 1080)],
    (d) => [media(at(d, `square-logo-${d}.png`), 1024, 1024)],
    (d) => [store(d)],
    (d) => [pair(media(at(d, `end-screen-${d}.mp4`), 1080, 1920), media(at(d, `end-screen-${d}-transparent.webm`), 1080, 1920, { alpha: 'light' }))],
    (d) => [pair(media(at(d, `corner-mark-${d}.png`), 900, 420, { alpha: 'light' }), media(at(d, `corner-mark-${d}-animated.webm`), 900, 420, { alpha: 'light' }))],
    (d) => [pair(media(at(d, `example-watermarked-${d}.mp4`), 1080, 1920))],
    (d) => [media(at(d, `placement-sheet-${d}.png`), 210, 297, { doc: true })],
  ];

  const head = el('div', { className: 'row head' });
  for (const d of DIRS) head.append(el('div', { className: 'cell' }, key(d.toUpperCase())));
  main.append(head);
  ROWS.forEach((cells, i) => {
    const n = i + 1, row = el('div', { className: 'row' });
    for (const d of DIRS) row.append(el('div', { className: 'cell' }, key(`${d.toUpperCase()}${n}`), ...cells(d)));
    main.append(row);
  });
  // shared by every direction: the logo animation in both inks
  main.append(el('div', { className: 'row shared' }, el('div', { className: 'cell' }, key(String(ROWS.length + 1)),
    el('div', { className: 'duo' },
      media('candidates/shared/logo-animation-white.webm', 1920, 1080, { alpha: 'dark' }),
      media('candidates/shared/logo-animation-black.webm', 1920, 1080, { alpha: 'light' })))));

  // ---- enlarge: fit to the window; the placement sheet opens at reading width and scrolls ----
  function zoom(m) {
    const big = m.tagName === 'VIDEO'
      ? el('video', { src: m.currentSrc || m.src, loop: true, playsInline: true, controls: true })
      : el('img', { src: m.currentSrc || m.src, alt: m.alt });
    stage.replaceChildren(el('div', { className: m.dataset.alpha ? `frame alpha ${m.dataset.alpha}` : 'frame' }, big));
    dialog.classList.toggle('doc', m.dataset.zoom === 'doc');
    for (const v of visible) v.pause();
    dialog.showModal();
    dialog.scrollTop = 0;
    if (big.tagName === 'VIDEO') play(big);
  }
  document.addEventListener('click', (e) => {
    const m = e.target.closest('[data-zoom]');
    if (m) zoom(m);
  });
  document.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && !dialog.open && e.target.matches && e.target.matches('[data-zoom]')) { e.preventDefault(); zoom(e.target); }
  });
  dialog.addEventListener('click', (e) => {
    if (e.clientX >= dialog.clientWidth || e.clientY >= dialog.clientHeight) return; // the tall sheet's scrollbar
    if (e.target.tagName !== 'VIDEO') dialog.close();
  });
  dialog.addEventListener('close', () => { stage.replaceChildren(); if (!reduceMotion) for (const v of visible) play(v); });
})();
</script>

</html>
